name: laamsui
description: "A design system with a collection of Futter UI Widgets and dart extensions."
version: 1.1.27
homepage: https://laams.com
repository: https://github.com/najibkr/laamsui
issue_tracker: https://github.com/najibkr/laamsui/issues

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  async: ^2.13.1
  intl: ^0.20.3
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  two_dimensional_scrollables: ^0.5.5
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Local Assets
  assets:
    - assets/svgs/

  # Local Fonts:
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/icons/Ionicons.ttf
    - family: MaterialCommunityIcons
      fonts:
        - asset: assets/icons/MaterialCommunityIcons.ttf
