name: laamsui
description: "A design system with a collection of Futter UI Widgets and dart extensions."
version: 0.6.28
homepage: https://laams.io
repository: https://github.com/najibkr/laamsui
issue_tracker: https://github.com/najibkr/laamsui/issues

environment:
  sdk: ">=3.7.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  async: ^2.11.0
  intl: ^0.19.0
  flutter_svg: ^2.0.17
  flutter_animate: ^4.5.2
  two_dimensional_scrollables: ^0.3.3
  flutter_keyboard_visibility: ^6.0.0
  go_router: ^14.8.1
  calendar_date_picker2: ^1.1.9
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Local Assets
  assets:
    - assets/svgs/

  # Local Fonts:
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/icons/Ionicons.ttf
    - family: MaterialCommunityIcons
      fonts:
        - asset: assets/icons/MaterialCommunityIcons.ttf
