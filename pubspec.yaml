name: laamsui
description: "A design system with a collection of Futter UI Widgets and dart extensions."
version: 1.0.8
homepage: https://laams.io
repository: https://github.com/najibkr/laamsui
issue_tracker: https://github.com/najibkr/laamsui/issues

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  async: ^2.13.0
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  flutter_animate: ^4.5.2
  two_dimensional_scrollables: ^0.3.7
  flutter_keyboard_visibility: ^6.0.0
  go_router: ^16.0.0
  calendar_date_picker2: ^2.0.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Local Assets
  assets:
    - assets/svgs/

  # Local Fonts:
  fonts:
    - family: Ionicons
      fonts:
        - asset: assets/icons/Ionicons.ttf
    - family: MaterialCommunityIcons
      fonts:
        - asset: assets/icons/MaterialCommunityIcons.ttf
